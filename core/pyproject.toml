[project]
name = "inpainter-core"
version = "0.1.0"
description = "Inpainter shared core"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "lupa>=2.0",
]

[project.scripts]
inpainter-core = "inpainter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inpainter"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "inpainter/schema"
"scripts" = "inpainter/scripts"
