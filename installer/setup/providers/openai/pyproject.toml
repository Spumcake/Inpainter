[project]
name = "inpainter-provider-openai"
version = "0.1.0"
description = "OpenAI provider for Inpainter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
