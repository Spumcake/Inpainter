[package]
name = "simple-sketch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
base64 = "=0.22.1"
directories = "=6.0.0"
draw = { path = "../../draw" }
egui = "=0.36.2"
kurbo = "=0.13.1"
protocol = { path = "../../protocol" }
