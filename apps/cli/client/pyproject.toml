[project]
name = "inpainter-cli"
version = "0.1.0"
description = "Inpainter command-line client"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "textual>=8.2.8",
]

[project.scripts]
inpainter = "src.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"../schema" = "src/schema"
