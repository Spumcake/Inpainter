[project]
name = "inpainter-cli"
version = "0.1.0"
description = "Inpainter command-line client"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "inpainter-core",
    "textual>=8.2.8",
]

[project.scripts]
inpainter = "cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.hatch.build.targets.wheel.force-include]
"../schema" = "cli/schema"
"../scripts" = "cli/scripts"

[tool.uv.sources]
inpainter-core = { path = "../../../core", editable = true }
