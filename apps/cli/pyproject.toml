[project]
name = "inpainter-cli"
version = "0.1.0"
description = "Inpainter command-line interface"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "cryptography>=43.0",
    "httpx>=0.27",
]

[project.scripts]
inpainter = "core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]
