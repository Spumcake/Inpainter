[project]
name = "inpainter-studio-host"
version = "0.1.0"
description = "Studio authoring Lua session host"
requires-python = ">=3.12"
dependencies = [
    "inpainter-core",
]

[project.scripts]
inpainter-studio-host = "studio_host.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_host"]

[tool.uv.sources]
inpainter-core = { path = "../../../../core", editable = true }
